appId: com.pagerviewexample
tags:
  - ios
  - regression
---
- runFlow: ../setup/issue_1096_keyboard_shrink_repro_setup.yaml

# With the keyboard open, SwiftUI keyboard avoidance must not shrink the page.
# A shrunk page clips Row 5 and moves its native frame, so the tap misses and
# the counter stays at 0.
- tapOn:
    id: 'issue-1096-input'

- waitForAnimationToEnd:
    timeout: 3000

- assertVisible:
    id: 'issue-1096-last-row'

- tapOn:
    id: 'issue-1096-last-row'

- assertVisible: 'last-row taps: 1'

# Dismiss the keyboard deterministically before checking the sheet drops back
# down. `hideKeyboard` alone is unreliable here: on iOS it only performs two
# blind swipes at the screen centre, and this screen has no scroll view with a
# non-default `keyboardDismissMode` under that point, so the keyboard survives.
# A single-line TextInput blurs on submit, so Enter is the reliable dismiss.
- pressKey: Enter

# No-op once the keyboard is already down; still dismisses natively on Android.
- hideKeyboard

- tapOn:
    id: 'issue-1096-last-row'

- assertVisible: 'last-row taps: 2'

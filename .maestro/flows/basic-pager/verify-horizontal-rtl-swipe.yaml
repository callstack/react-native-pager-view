appId: com.pagerviewexample
---
- tapOn:
    id: 'scroll-enabled-button'

- swipe:
    from:
      id: 'pager-view-horizontal'
    start: 10%, 50%
    end: 90%, 50%
    duration: 100

- assertVisible:
    id: 'pageNumber0'

- tapOn:
    id: 'scroll-enabled-button'

- swipe:
    from:
      id: 'pager-view-horizontal'
    start: 10%, 50%
    end: 90%, 50%
    duration: 100

- extendedWaitUntil:
    visible:
      id: 'pageNumber1'
    timeout: 5000

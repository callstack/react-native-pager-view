name: iOS Build

on:
  workflow_call:

jobs:
  ios-build:
    runs-on: macos-26
    timeout-minutes: 60
    env:
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_BASEDIR: ${{ github.workspace }}
      CCACHE_MAXSIZE: 2G
      # Xcode compiles with clang modules and VFS overlays, which ccache won't
      # cache unless told to relax those checks. Same list Expo uses.
      CCACHE_SLOPPINESS: clang_index_store,include_file_ctime,include_file_mtime,ivfsoverlay,pch_defines,modules,system_headers,time_macros
      CCACHE_DEPEND: true
      # Runner image updates touch clang even when it hasn't changed, so
      # compare its contents instead of its mtime.
      CCACHE_COMPILERCHECK: content
      AGENT_DEVICE_RUNNER_PATHS: |
        ~/.agent-device/apple-runner/derived/ios-simulator/*/Build/Products/*
        ~/.agent-device/apple-runner/derived/ios-simulator/*/.agent-device-runner-cache.json
        !~/.agent-device/apple-runner/derived/ios-simulator/*/Build/Products/AgentDeviceRunner.env.session-*
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Cache Pods
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: example/ios/Pods
          key: pods-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('example/ios/Podfile.lock') }}
          restore-keys: pods-${{ runner.os }}-${{ runner.arch }}-

      - name: Install ccache
        run: brew install ccache

      - name: Cache ccache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .ccache
          key: ccache-ios-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: ccache-ios-

      - name: Install example Pods
        run: bun pods
        working-directory: example

      # Simulator.app attaches the Mac keyboard by default, which hides the
      # software keyboard and leaves no Return key for the keyboard tests.
      - name: Detach hardware keyboard from simulator
        run: defaults write com.apple.iphonesimulator ConnectHardwareKeyboard -bool false

      - name: Build iOS App
        # RN's USE_CCACHE wrapper silently skips ccache on Xcode 26
        # (facebook/react-native#56612), so use Xcode's compiler launcher.
        run: |
          ccache --zero-stats
          bun example:ios:release --extra-params "C_COMPILER_LAUNCHER=$(command -v ccache) CLANG_ENABLE_EXPLICIT_MODULES_WITH_COMPILER_LAUNCHER=YES ONLY_ACTIVE_ARCH=YES"
          ccache --show-stats -v

      # The runner depends only on agent-device and Xcode, not on bun.lock.
      - name: Resolve agent-device runner cache key
        id: agent-device
        run: |
          pkg=e2e/node_modules/agent-device/package.json
          [ -f "$pkg" ] || pkg=node_modules/agent-device/package.json
          version=$(jq -r .version "$pkg")
          xcode=$(xcodebuild -version | awk '/Build version/ { print $3 }')
          echo "key=agent-device-runner-${RUNNER_OS}-${RUNNER_ARCH}-${version}-xcode-${xcode}" >> "$GITHUB_OUTPUT"

      - name: Restore agent-device runner
        id: agent-device-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.AGENT_DEVICE_RUNNER_PATHS }}
          key: ${{ steps.agent-device.outputs.key }}

      - name: Run e2e tests
        run: bun run test:ios
        working-directory: e2e
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # The runner is built before any test runs, so save it even if one fails.
      - name: Save agent-device runner
        if: ${{ !cancelled() && steps.agent-device-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.AGENT_DEVICE_RUNNER_PATHS }}
          key: ${{ steps.agent-device.outputs.key }}

      - name: Upload e2e report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: e2e-report-ios
          path: |
            e2e/.e2e/report.json
            e2e/.e2e/artifacts
          if-no-files-found: warn
          retention-days: 7

name: iOS Build

on:
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/ios.yml'
      - 'ios/**'
      - 'src/**'
      - 'example/ios/**'
      - 'example/src/**'
      - 'e2e/**'
  push:
    branches:
      - main

permissions:
  contents: read
  pull-requests: write

jobs:
  ios-build:
    runs-on: macos-26
    timeout-minutes: 60
    concurrency:
      group: ${{ github.ref }}-ios
      cancel-in-progress: true
    env:
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_BASEDIR: ${{ github.workspace }}
      CCACHE_MAXSIZE: 2G
      CCACHE_COMPRESS: true
    steps:
      - uses: oven-sh/setup-bun@735343b667d3e6f658f44d0eca948eb6282f2b76 # v2.0.2
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Install dependencies
        shell: bash
        run: bun install

      - name: Install example dependencies
        shell: bash
        run: bun install
        working-directory: example

      - name: Set up Ruby
        uses: ruby/setup-ruby@14594264cd68ce8a2345dd349bc3d138a4ef85c8 # v1.327.0
        with:
          ruby-version: '4.0'
          bundler-cache: true
          working-directory: example

      - name: Install ccache
        run: brew install ccache

      - name: Cache Pods
        id: cache-pods
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        env:
          cache-name: cached-ios-pods-deps
        with:
          path: example/ios/Pods
          key: ${{ hashFiles('example/ios/Podfile.lock') }}

      # USE_CCACHE makes react_native_post_install route clang through ccache.
      # RN's wrapper scripts are patched (example/patches) to find ccache on
      # PATH, see https://github.com/facebook/react-native/pull/56612.
      - name: Install example Pods
        run: bun pods
        working-directory: example
        env:
          USE_CCACHE: 1

      - name: Restore ccache
        uses: actions/cache/restore@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ccache-ios-${{ hashFiles('example/ios/Podfile.lock') }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            ccache-ios-${{ hashFiles('example/ios/Podfile.lock') }}-
            ccache-ios-

      # Simulator.app attaches the Mac keyboard by default, which hides the
      # software keyboard and leaves no Return key for the keyboard tests.
      - name: Detach hardware keyboard from simulator
        run: defaults write com.apple.iphonesimulator ConnectHardwareKeyboard -bool false

      - name: Build iOS App
        run: |
          ccache --zero-stats
          bun example:ios:release --extra-params "COMPILER_INDEX_STORE_ENABLE=NO"
          ccache --show-stats

      # Saved right after the build so a failing e2e run still warms the cache.
      - name: Save ccache
        if: ${{ !cancelled() }}
        uses: actions/cache/save@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ccache-ios-${{ hashFiles('example/ios/Podfile.lock') }}-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Install e2e dependencies
        run: bun install
        working-directory: e2e

      - name: Run e2e tests
        run: bun run test:ios
        working-directory: e2e
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload e2e report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: e2e-report-ios
          path: |
            e2e/.e2e/report.json
            e2e/.e2e/artifacts
          if-no-files-found: warn
          retention-days: 7
